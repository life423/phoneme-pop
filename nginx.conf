worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Hashed build assets can be cached forever; everything else (index.html included) revalidates.
    map $uri $cache_control {
        ~^/assets/  "public, max-age=31536000, immutable";
        default     "no-cache";
    }

    # Any other host (www, the *.azurecontainerapps.io default name) redirects to the canonical one.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://myprivateteacher.com$request_uri;
    }

    server {
        listen 80;
        server_name myprivateteacher.com localhost;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # A missing asset should 404, not quietly return the app shell.
        location /assets/ {
            try_files $uri =404;
        }
    }
}
