name: Trigger auto deployment for phoneme-pop

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/phoneme-pop-AutoDeployTrigger-22af2c1b-f890-4340-8d6a-a67bc48a314b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PHONEMEPOP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PHONEMEPOP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PHONEMEPOP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: hub.docker.com/r/aiandrew631/phoneme-pop
          registryUsername: ${{ secrets.PHONEMEPOP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PHONEMEPOP_REGISTRY_PASSWORD }}
          containerAppName: phoneme-pop
          resourceGroup: portfolio-apps
          imageToBuild: hub.docker.com/r/aiandrew631/phoneme-pop/phoneme-pop:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


